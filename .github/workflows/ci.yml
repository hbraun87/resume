name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://hbraun87.github.io
      BASE_PATH: /resume
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Real engines for the system tests: WebKit for iPhone and iPad, Chromium for Android.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
