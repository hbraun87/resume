name: CI

# Light suite on every push. For the extended suite (11 devices, 3 engines),
# run this workflow from the Actions tab and pick "extended".
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [light, extended]
        default: extended

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://hbraun87.github.io
      BASE_PATH: /resume
      E2E_SUITE: ${{ inputs.suite || 'light' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Light needs Chromium only; extended adds WebKit (iPhone, iPad) and Firefox.
      - if: env.E2E_SUITE != 'extended'
        run: npx playwright install --with-deps chromium
      - if: env.E2E_SUITE == 'extended'
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
